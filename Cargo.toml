[package]
name = "gdrust"
version = "0.1.0"
edition = "2021"

[dependencies]
minifb = "0.27"
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rayon = "1"
rodio = "0.20"

[profile.release]
opt-level = 3
lto = true

# native folder picker on first run
[dependencies.rfd]
version = "0.15"
default-features = false
features = ["xdg-portal", "async-std"]
